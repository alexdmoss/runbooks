workflow:
  rules:
    # Avoid duplicate pipelines: the branch pipeline already runs the jobs,
    # so don't also create a merge request pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - render
  - deploy
  - smoke

variables:
  DOMAIN: runbooks.alexos.dev
  HOSTNAME: runbooks.alexos.dev
  APP_ENGINE_PROJECT_ID: $MW_PROJECT_ID
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: v0.168.0

# Runs on every branch: a theme or Hugo bump that breaks the render fails here.
# Hugo is pinned here rather than taken from ci-tools, so a Hugo upgrade arrives
# as this repo's own MR and is rendered before it merges. App Engine serves the
# files directly, so there is no image to build.
render:
  stage: render
  image: al3xos/ci-tools:latest
  before_script:
    - curl -sSfLo /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/${HUGO_VERSION}/hugo_${HUGO_VERSION#v}_Linux-64bit.tar.gz"
    - tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo && rm -f /tmp/hugo.tar.gz
    - hugo version
  script:
    - ./scripts/render.sh
  artifacts:
    paths:
      - app/www/
    when: on_success
    expire_in: "1 day"

deploy:
  stage: deploy
  needs:
    - render
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: al3xos/ci-tools:latest
  script:
    - ./deploy.sh

smoke-test:
  stage: smoke
  needs:
    - deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: al3xos/ci-tools:latest
  script:
    - ./scripts/smoke-test.sh
